<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Arquitectura de RutaCheck">
  <title>RutaCheck — arquitectura</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A12"/>
      <stop offset="0.55" stop-color="#071427"/>
      <stop offset="1" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1D4ED8" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38BDF8"/>
    </marker>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="470" fill="url(#bg)"/>
  <rect width="1200" height="470" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.8"/>

  <text x="56" y="52" class="sans" font-size="20" font-weight="700" fill="#E2E8F0">RutaCheck · arquitectura</text>
  <text x="56" y="76" class="mono" font-size="12" fill="#64748B">supervisión de visitadores farmacéuticos</text>

  <g class="mono" font-size="12">
    <rect x="60" y="170" width="210" height="112" rx="12" fill="#0B1730" stroke="#1E3A8A"/>
    <text x="80" y="200" fill="#7DD3FC">app móvil</text>
    <text x="80" y="224" fill="#E2E8F0" class="sans" font-size="15">Visitador</text>
    <text x="80" y="248" fill="#64748B">GPS · check-in</text>
    <text x="80" y="268" fill="#64748B">turnos</text>

    <rect x="330" y="56" width="250" height="118" rx="12" fill="#0B1730" stroke="#1E3A8A"/>
    <text x="352" y="86" fill="#7DD3FC">admin web</text>
    <text x="352" y="110" fill="#E2E8F0" class="sans" font-size="15">React SPA</text>
    <text x="352" y="134" fill="#64748B">TanStack Router · Query</text>
    <text x="352" y="154" fill="#64748B">Tailwind · Zod</text>

    <rect x="640" y="170" width="210" height="112" rx="12" fill="#0B1730" stroke="#1E3A8A"/>
    <text x="662" y="200" fill="#7DD3FC">api</text>
    <text x="662" y="224" fill="#E2E8F0" class="sans" font-size="15">NestJS</text>
    <text x="662" y="248" fill="#64748B">JWT · REST admin</text>
    <text x="662" y="268" fill="#64748B">roles · auditoría</text>

    <rect x="910" y="170" width="230" height="112" rx="12" fill="#0B1730" stroke="#1E3A8A"/>
    <text x="932" y="200" fill="#7DD3FC">datos</text>
    <text x="932" y="224" fill="#E2E8F0" class="sans" font-size="15">PostgreSQL</text>
    <text x="932" y="248" fill="#64748B">visitas · rutas</text>
    <text x="932" y="268" fill="#64748B">alertas · turnos</text>

    <rect x="330" y="310" width="250" height="86" rx="12" fill="#0B1730" stroke="#1E3A8A"/>
    <text x="352" y="340" fill="#7DD3FC">mapas</text>
    <text x="352" y="364" fill="#E2E8F0" class="sans" font-size="15">Google Maps / OSM</text>
    <text x="352" y="384" fill="#64748B">marcadores · polilíneas</text>
  </g>

  <g stroke="#2E6FA8" stroke-opacity="0.95" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M270 226 L636 226"/>
    <path d="M580 118 C612 118 620 160 638 182"/>
    <path d="M850 226 L906 226"/>
    <path d="M455 174 L455 306"/>
  </g>

  <g class="mono" font-size="11" fill="#7C93B0">
    <text x="286" y="218">GPS en vivo</text>
    <text x="598" y="110">HTTPS + JWT</text>
    <text x="858" y="216">SQL</text>
    <text x="466" y="252">tiles</text>
  </g>

  <g class="mono" font-size="11" fill="#64748B">
    <text x="60" y="430">alertas antifraude: GPS falso · root/jailbreak · salto de ruta</text>
    <text x="60" y="450">auditoría de visitas · historial de rutas · KPIs por equipo</text>
  </g>

  <rect x="0" y="468" width="1200" height="2" fill="url(#accent)" opacity="0.5"/>
</svg>
